services:
  mongo:
    image: mongo:7
    container_name: tos-guardian-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  cache-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tos-guardian-cache-api
    restart: unless-stopped
    environment:
      - PORT=8787
      - DB_NAME=tos_guardian
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    ports:
      - "8787:8787"

volumes:
  mongo_data:
